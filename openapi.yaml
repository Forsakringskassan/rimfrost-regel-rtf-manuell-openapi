openapi: 3.1.0
info:
  title: RTF Manuell API
  version: 1.1.0
  description: API för att hämta all relevant information för att utföra en manuell rätt till försäkring kontroll

paths:
  /{handlaggningId}:
    get:
      summary: Hämta information som behövs för att utföra kontrollen
      description: Hämta information som behövs för att utföra kontrollen
      parameters:
        - $ref: "#/components/parameters/HandlaggningId"
      responses:
        "200":
          description: Information hämtad OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDataResponse"
        "400":
          description: Ogiltig begäran
        "403":
          description: Åtkomst nekad
        "404":
          description: Informationen hittades inte
        "500":
          description: Internt serverfel
        "503":
          description: Tjänsten är inte tillgänglig
    patch:
      summary: Uppdatera information om ersättning
      description: Uppdatera information om ersättning
      parameters:
        - $ref: "#/components/parameters/HandlaggningId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchErsattningRequest"
      responses:
        "204":
          description: Uppdatering genomförd OK
        "400":
          description: Ogiltig begäran
        "403":
          description: Åtkomst nekad
        "404":
          description: Informationen hittades inte
        "500":
          description: Internt serverfel
        "503":
          description: Tjänsten är inte tillgänglig

  /{handlaggningId}/komplettering:
    get:
      summary: Hämta kompletteringsdata för ärendet
      description: Hämta aktuell yrkande-data som sökanden ska komplettera
      parameters:
        - $ref: "#/components/parameters/HandlaggningId"
      responses:
        "200":
          description: Kompletteringsdata hämtad OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RtfKompletteringData"
        "400":
          description: Ogiltig begäran
        "403":
          description: Åtkomst nekad
        "404":
          description: Ärendet hittades inte
        "500":
          description: Internt serverfel
        "503":
          description: Tjänsten är inte tillgänglig
    patch:
      summary: Registrera kompletterande uppgifter
      description: Registrera sökandens kompletterande uppgifter
      parameters:
        - $ref: "#/components/parameters/HandlaggningId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RtfKompletteringData"
      responses:
        "204":
          description: Komplettering registrerad OK
        "400":
          description: Ogiltig begäran
        "403":
          description: Åtkomst nekad
        "404":
          description: Ärendet hittades inte
        "500":
          description: Internt serverfel
        "503":
          description: Tjänsten är inte tillgänglig

components:
  parameters:
    HandlaggningId:
      name: handlaggningId
      in: path
      required: true
      description: ID för handläggningsärendet
      schema:
        type: string
        format: uuid

  schemas:
    GetDataResponse:
      type: object
      properties:
        handlaggning_id:
          type: string
          format: uuid
        kund:
          $ref: "#/components/schemas/Kund"
        ersattningar:
          type: array
          items:
            $ref: "#/components/schemas/Ersattning"
      required:
        - handlaggning_id
        - kund
        - ersattningar

    PatchErsattningRequest:
      type: object
      properties:
        ersattningar:
          type: array
          items:
            $ref: "#/components/schemas/UpdateErsattning"
      required:
        - ersattningar

    Kund:
      type: object
      properties:
        efternamn:
          type: string
        fornamn:
          type: string
        kon:
          type: string
          enum: [MAN, KVINNA]
        anstallning:
          $ref: "#/components/schemas/Anstallning"

    Anstallning:
      type: object
      properties:
        organisationsnummer:
          type: string
        organisationsnamn:
          type: string
        arbetstid_procent:
          type: integer
        anstallningsdag:
          type: string
          format: date
        sista_anstallningsdag:
          type: string
          format: date

    Ersattning:
      type: object
      properties:
        ersattning_id:
          type: string
          format: uuid
        ersattningstyp:
          type: string
        omfattning_procent:
          type: integer
        belopp:
          type: integer
        berakningsgrund:
          type: integer
        beslutsutfall:
          $ref: "#/components/schemas/Beslutsutfall"
        avslagsanledning:
          type: string
          nullable: true
        from:
          type: string
          format: date
        tom:
          type: string
          format: date
      required:
        - ersattning_id
        - ersattningstyp
        - omfattning_procent
        - belopp
        - berakningsgrund
        - from
        - tom

    UpdateErsattning:
      type: object
      properties:
        ersattningId:
          type: string
          format: uuid
        avslagsanledning:
          type: string
        beslutsutfall:
          $ref: "#/components/schemas/Beslutsutfall"
      required:
        - ersattningId
        - beslutsutfall

    Beslutsutfall:
      type: string
      enum: [JA, NEJ, FU]

    RtfKompletteringData:
      type: object
      properties:
        personnummer:
          type: string
          nullable: true
        avsikt:
          type: string
          nullable: true
      required:
        - personnummer
        - avsikt
